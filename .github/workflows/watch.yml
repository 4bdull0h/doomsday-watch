name: Doomsday ticket watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test notification
        if: ${{ inputs.test }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 watch.py --test

      - name: Check Cinematica
        if: ${{ !inputs.test }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHECK_INTERVAL: "60"
        run: python3 watch.py --duration 240

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          # heartbeat once a day keeps GitHub from disabling the schedule after 60 idle days
          date -u +%F > heartbeat
          git config user.name "doomsday-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A state.json heartbeat 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
