name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do for p in movies movies/today movies/soon repertory/movie/1014/grouped; do
            echo "== $p"; curl -sS -m 60 -A "Mozilla/5.0" -H "Accept: application/json" -o /dev/null -w "%{http_code} ttfb=%{time_starttransfer} total=%{time_total} size=%{size_download}\n" "https://cinematica.uz/api/v1/$p" || true
          done; done
